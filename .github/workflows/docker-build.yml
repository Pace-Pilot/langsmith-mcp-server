name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ppappregistry.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ppappregistry.azurecr.io/langsmith-mcp:${{ github.sha }} .
          docker push ppappregistry.azurecr.io/langsmith-mcp:${{ github.sha }}

          # Also tag and push as latest for the branch
          docker tag ppappregistry.azurecr.io/langsmith-mcp:${{ github.sha }} ppappregistry.azurecr.io/langsmith-mcp:${{ github.ref_name }}
          docker push ppappregistry.azurecr.io/langsmith-mcp:${{ github.ref_name }}
